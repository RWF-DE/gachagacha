name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble _site (runtime files only)
        run: |
          rm -rf _site
          mkdir _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r css js fonts icons _site/
          touch _site/.nojekyll
      - name: Check sw.js PRECACHE (entries exist, none twice, no runtime file left out)
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const fail = (msg) => { console.error(msg); process.exit(1); };
          const src = fs.readFileSync('_site/sw.js', 'utf8');
          const m = src.match(/const PRECACHE = (\[[\s\S]*?\]);/);
          if (!m) fail('PRECACHE not found in sw.js');
          // The array literal itself is evaluated, so comments, trailing commas and either quote style are fine.
          const list = new Function('return ' + m[1])();
          if (!Array.isArray(list) || !list.every((u) => typeof u === 'string')) fail('PRECACHE must be an array of strings');
          // Resolve each entry the way the service worker does (relative to sw.js): './js/a.js' and 'js/a.js' are one request.
          const BASE = 'https://example.invalid/app/';
          const urls = list.map((u) => { const x = new URL(u, BASE + 'sw.js'); x.hash = ''; return x; });
          // the file inside the app directory ('./' is index.html), or null for an entry that points outside it
          const file = (x) => (x.href.startsWith(BASE) ? decodeURIComponent(x.pathname.slice('/app/'.length)) || 'index.html' : null);
          const errors = [];
          // 1. every entry exists in _site
          const missing = list.filter((u, i) => !file(urls[i]) || !fs.existsSync(path.join('_site', file(urls[i]))));
          if (missing.length) errors.push('Missing from _site (or outside the app directory): ' + missing.join(', '));
          // 2. no request twice: Cache.addAll rejects duplicates, which fails the service worker install (no offline)
          const seen = new Set(), twice = [];
          list.forEach((u, i) => { if (seen.has(urls[i].href)) twice.push(u); seen.add(urls[i].href); });
          if (twice.length) errors.push('Listed twice in PRECACHE (Cache.addAll would reject them): ' + twice.join(', '));
          // 3. every file under js/ css/ fonts/ is listed (fonts/OFL-*.txt are licence texts, never fetched by the app)
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => (e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]));
          const listed = new Set(urls.map(file));
          const unlisted = ['js', 'css', 'fonts'].flatMap((d) => walk(path.join('_site', d)))
            .map((f) => path.relative('_site', f).split(path.sep).join('/'))
            .filter((f) => !f.endsWith('.txt') && !listed.has(f));
          if (unlisted.length) errors.push('Not in PRECACHE (add to sw.js and bump VERSION): ' + unlisted.join(', '));
          if (errors.length) fail(errors.join('\n'));
          console.log('PRECACHE ok:', list.length, 'entries');
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
