<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>YoSoro! お宝ガチャ</title>
  <meta name="description" content="電波祭2026 景品抽選（オフライン対応）">
  <meta name="theme-color" content="#EEEADB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="お宝ガチャ">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/dela-gothic-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/zen-kaku-gothic-new-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/poster.css">
</head>
<body>
  <!-- ポスター全体（1180×820 / 縦 820×1180 を基準に等倍で拡縮。js/stage.js が演出レイヤーを足す） -->
  <div id="stage" data-screen="idle" data-o="l">
    <div id="panel">
      <div id="screen-host"></div>
    </div>

    <!-- ロゴ：3秒長押しでスタッフ画面。結果オーバーレイより上に出して、未確認の抽選中でも入れるようにする -->
    <button id="logo" class="logo" type="button" aria-label="YoSoro! お宝ガチャ" data-testid="logo">
      <svg class="logo-mark" viewBox="-300 -300 600 600" aria-hidden="true"><use href="#wheel" x="-300" y="-300" width="600" height="600"/></svg>
      <span class="logo-text"><span class="jp">電波祭 2026 / </span>DENPASAI 2026</span>
    </button>
  </div>

  <div id="admin-root"></div>

  <noscript><p style="padding:2rem;font-size:1.4rem">このアプリの利用には JavaScript が必要です。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
