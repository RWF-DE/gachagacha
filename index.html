<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>YoSoro! お宝ガチャ</title>
  <meta name="description" content="電波祭2026 景品抽選（オフライン対応）">
  <meta name="theme-color" content="#6cc6ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="お宝ガチャ">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stage.css">
</head>
<body>
  <div id="scene-bg" aria-hidden="true"></div>

  <!-- ロゴ：3秒長押しでスタッフ画面。結果オーバーレイより上に出して、未確認の抽選中でも入れるようにする -->
  <header class="brand">
    <!-- 3秒長押しでスタッフ画面 -->
    <button id="logo" class="logo" type="button" aria-label="YoSoro! お宝ガチャ" data-testid="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
            <circle cx="32" cy="32" r="17"/>
            <path d="M32 4v14M32 46v14M4 32h14M46 32h14M12.2 12.2l9.9 9.9M41.9 41.9l9.9 9.9M12.2 51.8l9.9-9.9M41.9 22.1l9.9-9.9"/>
          </g>
          <circle cx="32" cy="32" r="6" fill="currentColor"/>
        </svg>
      </span>
      <span class="logo-text">YoSoro!</span>
    </button>
  </header>

  <main id="app">
    <!-- 左：参加者の操作パネル（core） -->
    <aside id="panel">
      <div id="screen-host"></div>
    </aside>

    <!-- 右：ガチャ機・舵輪・演出（visual が mount する） -->
    <div id="stage"></div>
  </main>

  <div id="admin-root"></div>

  <noscript><p style="padding:2rem;font-size:1.4rem">このアプリの利用には JavaScript が必要です。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
