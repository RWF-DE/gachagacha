<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stage-demo</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/stage.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--sky-bottom); }
  #app { position: relative; z-index: var(--z-main); display: grid; grid-template-columns: 40% 60%; height: 100%; }
  @media (orientation: portrait) { #app { grid-template-columns: 1fr; grid-template-rows: 34% 66%; } }
  #panel { padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  #panel .card { background: var(--paper); border-radius: var(--radius-l); box-shadow: var(--shadow-card); padding: 20px; }
  #panel h1 { margin: 0 0 6px; font-size: var(--fs-l); }
  #panel p { margin: 0; font-size: var(--fs-s); color: var(--ink-soft); }
  #panel button { font: inherit; font-weight: 700; font-size: 15px; padding: 8px 12px; margin: 3px; border-radius: 10px; border: 2px solid var(--sea); background: #fff; color: var(--sea-deep); cursor: pointer; }
  #panel button.on { background: var(--sea); color: #fff; }
  #log { font: 12px/1.4 monospace; white-space: pre-wrap; max-height: 110px; overflow: auto; }
  #stage { position: relative; min-height: 0; min-width: 0; }
  .ok-btn { font: 800 22px var(--font); padding: 12px 28px; border-radius: 999px; border: 3px solid var(--brass-light); background: var(--sea); color: #fff; box-shadow: var(--shadow-btn); cursor: pointer; }
</style>
</head>
<body>
<div id="scene-bg"></div>
<div id="app">
  <aside id="panel">
    <div class="card">
      <h1>YoSoro! stage demo</h1>
      <p>左パネルのプレースホルダ（core が置き換える）。</p>
    </div>
    <div class="card" id="ctl">
      <div>
        <button id="b-enable">操作を有効化</button>
        <button id="b-disable">無効化</button>
        <button id="b-attract" class="on">attract</button>
        <button id="b-reduced">reduced</button>
      </div>
      <div>
        <button data-tier="sponsor">協賛特別賞</button>
        <button data-tier="rare">レアステッカー賞</button>
        <button data-tier="sticker">ステッカー賞</button>
        <button data-tier="sponsor2">長い景品名</button>
      </div>
      <div>
        <button id="b-static">showResultStatic</button>
        <button id="b-spin">startSpin</button>
        <button id="b-abort">abort</button>
        <button id="b-reset">reset</button>
      </div>
      <div>
        <button id="b-mood-c">mood celebrate</button>
        <button id="b-mood-n">idle</button>
        <button id="b-mood-calm">calm</button>
        <button id="b-vol">sound ON</button>
      </div>
      <div id="log"></div>
    </div>
  </aside>
  <main id="stage"></main>
</div>

<script type="module">
import { createScene } from '../js/scene.js';
import { createStage } from '../js/stage.js';
import { sound } from '../js/sound.js';

const q = new URLSearchParams(location.search);
const scene = createScene(document.getElementById('scene-bg'));
let reduced = q.get('reduced') === '1';
const stage = createStage(document.getElementById('stage'), { sound, reducedMotion: reduced, onMood: (m) => scene.setMood(m) });
const log = (t) => { const el = document.getElementById('log'); el.textContent = `${new Date().toLocaleTimeString()} ${t}\n` + el.textContent.slice(0, 600); };

const SAMPLES = {
  sponsor: { tier: 'sponsor', categoryName: '協賛特別賞', prizeName: 'グリーンランド招待券', label: '1-0042' },
  sponsor2: { tier: 'sponsor', categoryName: '協賛特別賞', prizeName: 'E・ZO FUKUOKA招待券', label: '2-0107' },
  rare: { tier: 'rare', categoryName: 'レアステッカー賞', prizeName: '電波祭ステッカー〈レア〉', label: '1-0043' },
  sticker: { tier: 'sticker', categoryName: 'ステッカー賞', prizeName: '電波祭ステッカー', label: '1-0044' },
};

window.__turns = 0;
window.__stage = stage;
window.__scene = scene;
stage.onTurn(() => {
  window.__turns++;
  log('onTurn #' + window.__turns);
  stage.startSpin();
  const t = q.get('tier') || 'sticker';
  setTimeout(() => stage.playReveal(SAMPLES[t]).then(() => { log('reveal done'); window.__revealDone = (window.__revealDone || 0) + 1; }), 400);
});

const okBtn = document.createElement('button');
okBtn.className = 'ok-btn';
okBtn.textContent = 'お渡し済み・OK（長押し想定）';
okBtn.dataset.testid = 'ok-demo';
okBtn.addEventListener('click', async () => { await stage.reset(); log('reset done'); stage.setInteractive(true); });
stage.resultActionsEl.appendChild(okBtn);

const $ = (id) => document.getElementById(id);
$('b-enable').onclick = () => { sound.unlock(); stage.setInteractive(true); };
$('b-disable').onclick = () => stage.setInteractive(false);
let attract = true;
$('b-attract').onclick = (e) => { attract = !attract; stage.setAttract(attract); e.target.classList.toggle('on', attract); };
$('b-reduced').onclick = (e) => { reduced = !reduced; stage.setReducedMotion(reduced); e.target.classList.toggle('on', reduced); };
document.querySelectorAll('[data-tier]').forEach((b) => b.onclick = () => {
  sound.unlock();
  stage.setInteractive(false);
  const t0 = performance.now();
  stage.playReveal(SAMPLES[b.dataset.tier]).then(() => log(`reveal ${b.dataset.tier} ${(performance.now() - t0) | 0}ms`));
});
$('b-static').onclick = () => { sound.unlock(); stage.showResultStatic(SAMPLES[q.get('tier') || 'sponsor']); };
$('b-spin').onclick = () => { sound.unlock(); stage.startSpin(); };
$('b-abort').onclick = () => { stage.abort(); stage.setInteractive(true); };
$('b-reset').onclick = async () => { await stage.reset(); stage.setInteractive(true); log('reset done'); };
$('b-mood-c').onclick = () => scene.setMood('celebrate');
$('b-mood-n').onclick = () => scene.setMood('idle');
$('b-mood-calm').onclick = () => scene.setMood('calm');
let on = true;
$('b-vol').onclick = (e) => { on = !on; sound.setEnabled(on); e.target.textContent = on ? 'sound ON' : 'sound OFF'; };

if (q.get('interactive') !== '0') stage.setInteractive(true);
</script>
</body>
</html>
